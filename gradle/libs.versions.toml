[versions]
# Kotlin/SQLDelight are kept in lockstep with the primary consumer (bitMessage): the klib ABI
# requires consumer Kotlin >= library Kotlin.
agp = "9.0.0"
kotlin = "2.4.0"
android-minSdk = "26"
android-compileSdk = "37"
sqldelight = "2.3.2"
# SQLCipher version must stay identical on both platforms: Android via net.zetetic AAR, iOS via
# the static library built by native/build-sqlcipher.sh (see that script's SQLCIPHER_VERSION).
sqlcipher-android = "4.16.0"
androidx-sqlite = "2.7.0"
coroutines = "1.11.0"
vanniktechMavenPublish = "0.37.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher-android" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
